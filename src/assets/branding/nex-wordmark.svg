<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 863 181"
  fill="none"
  role="img"
  aria-label="NEX+"
>
  <defs>
    <!-- Gradiente vertical para as letras NEX -->
    <linearGradient id="nexLettersGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="50%" stopColor="#FFFFFF" />
      <stop offset="80%" stopColor="#E0E7FF" />
      <stop offset="100%" stopColor="#C7D2FE" />
    </linearGradient>

    <!-- Gradiente da metade superior/esquerda do + (Rosa/Magenta) -->
    <linearGradient id="plusTopLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FB7185" />
      <stop offset="45%" stopColor="#F43F5E" />
      <stop offset="100%" stopColor="#D946EF" />
    </linearGradient>

    <!-- Gradiente da metade inferior/direita do + (Laranja/Âmbar) -->
    <linearGradient id="plusBottomRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FB923C" />
      <stop offset="50%" stopColor="#F97316" />
      <stop offset="100%" stopColor="#EA580C" />
    </linearGradient>

    <!-- Glow sutil atrás das letras NEX -->
    <filter id="nexGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#818CF8" flood-opacity="0.35" />
    </filter>

    <!-- Glow vibrante atrás do + -->
    <filter id="plusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#F43F5E" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#EA580C" flood-opacity="0.35" />
    </filter>
  </defs>

